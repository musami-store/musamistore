name: Mantener Supabase Activo

on:
  schedule:
    # Se ejecuta todos los días a las 12:00 AM UTC
    - cron: '0 0 * * *'
  workflow_dispatch: # Te permite activar el botón manualmente para probar si funciona

jobs:
  ping_supabase:
    runs-on: ubuntu-latest
    steps:
      - name: Enviar petición de actividad a Supabase
        run: |
          curl -X GET "${{ secrets.SUPABASE_URL }}/rest/v1/" \
          -H "apikey: ${{ secrets.SUPABASE_KEY }}" \
          -H "Authorization: Bearer ${{ secrets.SUPABASE_KEY }}"
